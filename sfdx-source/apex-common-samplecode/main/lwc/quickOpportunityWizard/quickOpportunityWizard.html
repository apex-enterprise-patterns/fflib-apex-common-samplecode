<template>
	<lightning-quick-action-panel header="Quick Opportunity">
		<template lwc:if={errorMessage}>
			<div class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_small" role="alert">
				{errorMessage}
			</div>
		</template>
		<lightning-record-view-form record-id={recordId} object-api-name="Account">
			<div class="slds-grid slds-wrap slds-gutters">
				<div class="slds-col slds-size_1-of-3">
					<lightning-output-field field-name="Name"></lightning-output-field>
				</div>
				<div class="slds-col slds-size_1-of-3">
					<lightning-output-field field-name="AccountNumber"></lightning-output-field>
				</div>
				<div class="slds-col slds-size_1-of-3">
					<lightning-output-field field-name="OwnerId"></lightning-output-field>
				</div>
			</div>
		</lightning-record-view-form>

		<lightning-record-edit-form
			object-api-name="Opportunity"
			onsubmit={handleSubmit}
			onerror={handleFormError}
		>
			<div class="slds-grid slds-wrap slds-gutters">
				<div class="slds-col slds-size_1-of-3">
					<lightning-input-field field-name="Name" value={opportunityName} required></lightning-input-field>
				</div>
				<div class="slds-col slds-size_1-of-3">
					<lightning-input-field field-name="StageName" required></lightning-input-field>
				</div>
				<div class="slds-col slds-size_1-of-3">
					<lightning-input-field field-name="CloseDate" required></lightning-input-field>
				</div>
			</div>
		</lightning-record-edit-form>

		<div class="slds-m-top_medium">
			<h3 class="slds-text-heading_small slds-m-bottom_small">
				Opportunity Products - Select from Recently Used
			</h3>
			<lightning-datatable
				key-field="key"
				data={lineItems}
				columns={columns}
				draft-values={draftValues}
				suppress-bottom-bar
				oncellchange={handleCellChange}
			></lightning-datatable>
		</div>

		<div slot="footer">
			<lightning-button variant="neutral" label="Cancel" onclick={handleCancel}></lightning-button>
			<lightning-button
				variant="brand"
				class="slds-m-left_x-small"
				label="Create Opportunity"
				onclick={handleCreate}
				disabled={isSaving}
			></lightning-button>
		</div>
	</lightning-quick-action-panel>
</template>
